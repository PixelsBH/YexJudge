services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in YexJudge/.env}
      POSTGRES_DB: yexjudge
    volumes:
      - yexjudge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    user: "999:999"
    read_only: true
    tmpfs:
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runtime-image:
    image: yexjudge-runtime:latest
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    command: ["true"]
    restart: "no"

  cpp-compile-image:
    image: yexjudge-cpp-compile:latest
    build:
      context: .
      dockerfile: docker/compile/Dockerfile
      args:
        YEXJUDGE_CPP_FLAGS: ${YEXJUDGE_CPP_FLAGS:-}
    command: ["true"]
    restart: "no"

  yexjudge:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      runtime-image:
        condition: service_completed_successfully
      cpp-compile-image:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in YexJudge/.env}@postgres:5432/yexjudge?sslmode=disable
      PORT: 8080
      TMPDIR: /home/pixels/.local/share/yexjudge/workspaces
      WORKER_COUNT: 4
      SANDBOX_POOL_SIZE: 4
      COMPILE_SLOTS: 2
      MAX_QUEUED: 50
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    user: "0:0"
    read_only: true
    tmpfs:
      - /app:noexec,nosuid,size=50m
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Container API socket mounted as the Docker socket YexJudge's client
      # expects. Set CONTAINER_SOCKET in .env for your runtime:
      #   Podman rootless: /run/user/$(id -u)/podman/podman.sock
      #   Docker:          /var/run/docker.sock
      # The socket must be reachable and running before startup.
      - ${CONTAINER_SOCKET:?Set CONTAINER_SOCKET in YexJudge/.env}:/var/run/docker.sock
      - ${WORKSPACE_DIR:-/home/pixels/.local/share/yexjudge/workspaces}:/home/pixels/.local/share/yexjudge/workspaces
    working_dir: /app

volumes:
  yexjudge-postgres-data:
