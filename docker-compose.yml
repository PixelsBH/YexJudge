services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in YexJudge/.env}
      POSTGRES_DB: yexjudge
    volumes:
      - yexjudge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yexjudge"]
      interval: 2s
      timeout: 3s
      retries: 15

  yexjudge:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/yexjudge?sslmode=disable
      PORT: 8080
      TMPDIR: ${PWD}/.yexjudge-workspaces
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep this path identical on the host and in the server container because
      # the host Docker daemon bind-mounts compile workspaces from this path.
      - ${PWD}/.yexjudge-workspaces:${PWD}/.yexjudge-workspaces
    working_dir: /app

volumes:
  yexjudge-postgres-data:
