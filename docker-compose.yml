services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in YexJudge/.env}
      POSTGRES_DB: yexjudge
    volumes:
      - yexjudge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yexjudge"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    cpus: 0.5

  runtime-image:
    image: yexjudge-runtime:latest
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    command: ["true"]
    restart: "no"

  yexjudge:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      runtime-image:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in YexJudge/.env}@postgres:5432/yexjudge?sslmode=disable
      PORT: 8080
      TMPDIR: /home/pixels/.local/share/yexjudge/workspaces
      WORKER_COUNT: 4
      SANDBOX_POOL_SIZE: 4
      COMPILE_SLOTS: 2
      MAX_QUEUED: 50
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The host and server container paths must match because the host Docker daemon
      # bind-mounts workspaces at this absolute path for compile/runtime containers.
      - /home/pixels/.local/share/yexjudge/workspaces:/home/pixels/.local/share/yexjudge/workspaces
    working_dir: /app

volumes:
  yexjudge-postgres-data:
